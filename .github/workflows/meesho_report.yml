name: Meesho Order Report

on:
  workflow_dispatch:

  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * *"

    # 01:00 PM IST
    - cron: "30 7 * * *"

    # 06:00 PM IST
    - cron: "30 12 * * *"

    # 10:00 PM IST
    - cron: "30 16 * * *"


jobs:
  meesho-report:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Download repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 3. Install Python dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ==========================================
      # 4. Install Playwright Chromium
      # ==========================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium


      # ==========================================
      # 5. Restore compressed Meesho session
      # ==========================================

      - name: Restore Meesho session
        env:
          SESSION_B64: ${{ secrets.MEESHO_SESSION_B64 }}

        run: |
          python - <<'PY'
          import os
          import base64
          import gzip
          import json
          import sys

          print("🔐 Reading Meesho session secret...")

          encoded = os.environ.get(
              "SESSION_B64",
              ""
          ).strip()

          if not encoded:
              print("❌ MEESHO_SESSION_B64 secret is empty.")
              sys.exit(1)

          print(
              f"📏 Encoded length: "
              f"{len(encoded)} characters"
          )

          # ------------------------------------------
          # Base64 decode
          # ------------------------------------------

          try:

              compressed = base64.b64decode(
                  encoded,
                  validate=True
              )

          except Exception as error:

              print("❌ Base64 decoding failed.")
              print(error)

              sys.exit(1)


          print(
              f"📦 Base64 decoded size: "
              f"{len(compressed)} bytes"
          )


          # ------------------------------------------
          # GZIP decompress
          # ------------------------------------------

          try:

              session_bytes = gzip.decompress(
                  compressed
              )

          except Exception as error:

              print("❌ GZIP decompression failed.")
              print(error)

              sys.exit(1)


          print(
              f"📄 Decompressed session size: "
              f"{len(session_bytes)} bytes"
          )


          # ------------------------------------------
          # Create session file
          # ------------------------------------------

          with open(
              "meesho_session.json",
              "wb"
          ) as file:

              file.write(session_bytes)


          # ------------------------------------------
          # Validate JSON
          # ------------------------------------------

          try:

              with open(
                  "meesho_session.json",
                  "r",
                  encoding="utf-8"
              ) as file:

                  session_data = json.load(file)

          except Exception as error:

              print("❌ Session JSON is invalid.")
              print(error)

              sys.exit(1)


          if not isinstance(
              session_data,
              dict
          ):

              print(
                  "❌ Session JSON has unexpected format."
              )

              sys.exit(1)


          print(
              "✅ Meesho session restored successfully."
          )

          print(
              "✅ Session JSON is valid."
          )


      # ==========================================
      # 6. Run Meesho report
      # ==========================================

      - name: Run Meesho report

        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

        run: |
          python meesho_daily_report.py


      # ==========================================
      # 7. Delete session after execution
      # ==========================================

      - name: Remove session

        if: always()

        run: |
          rm -f meesho_session.json

          echo "🧹 Meesho session removed."

